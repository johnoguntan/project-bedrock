name: Terraform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write # required to post/update the plan comment on PRs

env:
  TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Debug OIDC token claims
      uses: actions/github-script@v7
      with:
        script: |
          const token = await core.getIDToken('sts.amazonaws.com');
          const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
          console.log(JSON.stringify({
            iss: payload.iss,
            aud: payload.aud,
            sub: payload.sub,
            repository: payload.repository,
            repository_owner: payload.repository_owner,
            ref: payload.ref,
            actor: payload.actor
          }, null, 2));
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/bedrock-github-actions-role
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        # Must satisfy the required_version constraint (>= 1.11.0) in
        # versions.tf, which relies on native S3 backend locking
        # (use_lockfile). Do not downgrade this without also relaxing
        # that constraint.
        terraform_version: "1.11.4"

    # backend.hcl is gitignored (it's environment-specific, not secret,
    # but there's no reason to commit it) — CI reconstructs it from a
    # repository variable set once in Settings > Secrets and variables >
    # Actions > Variables (TF_STATE_BUCKET), pointing at the bucket
    # created by terraform/bootstrap/.
    - name: Write backend config
      run: |
        cat > backend.hcl <<EOF
        bucket = "${{ vars.TF_STATE_BUCKET }}"
        EOF

    - name: Terraform Init
      run: terraform init -backend-config=backend.hcl

    - name: Terraform Format
      run: terraform fmt -check -recursive

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      id: plan
      if: github.event_name == 'pull_request'
      run: |
        terraform plan -no-color -input=false -out=tfplan
        terraform show -no-color tfplan > plan.txt
      continue-on-error: true

    - name: Post plan as PR comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = 'terraform/plan.txt';
          let planOutput = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No plan output produced.';

          // GitHub comment body limit is 65536 chars — truncate defensively.
          const maxLen = 60000;
          if (planOutput.length > maxLen) {
            planOutput = planOutput.slice(0, maxLen) + '\n\n... (truncated, see full log in the workflow run)';
          }

          const marker = '<!-- terraform-plan-comment -->';
          const outcome = '${{ steps.plan.outcome }}';
          const body = `${marker}\n### Terraform Plan (\`${outcome}\`)\n<details><summary>Show plan</summary>\n\n\`\`\`terraform\n${planOutput}\n\`\`\`\n\n</details>`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Fail job if plan failed
      if: github.event_name == 'pull_request' && steps.plan.outcome == 'failure'
      run: exit 1

    - name: Terraform Apply
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: terraform apply -auto-approve -input=false
