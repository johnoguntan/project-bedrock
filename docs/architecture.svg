<svg viewBox="0 0 1600 1150" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5a6b7b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1150" fill="#f7f8fa"/>

  <text x="30" y="38" font-size="24" font-weight="700" fill="#1b2733">Project Bedrock — InnovateMart EKS Architecture</text>
  <text x="30" y="60" font-size="13" fill="#5a6b7b">AWS us-east-1 · project-bedrock-vpc · project-bedrock-cluster</text>

  <!-- AWS Cloud boundary -->
  <rect x="20" y="80" width="1560" height="900" rx="10" fill="none" stroke="#8a97a3" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="35" y="102" font-size="13" font-weight="600" fill="#5a6b7b">AWS Account — us-east-1</text>

  <!-- VPC boundary -->
  <rect x="50" y="120" width="1050" height="700" rx="8" fill="#eef4fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="65" y="145" font-size="15" font-weight="700" fill="#204a76">VPC: project-bedrock-vpc (10.0.0.0/16)</text>

  <!-- IGW -->
  <rect x="480" y="160" width="150" height="40" rx="6" fill="#ffd9a8" stroke="#c97a1a" stroke-width="1.5"/>
  <text x="555" y="185" font-size="12" text-anchor="middle" fill="#5a3a10">Internet Gateway</text>

  <!-- AZ A -->
  <rect x="75" y="225" width="490" height="560" rx="6" fill="#ffffff" stroke="#9db3c8" stroke-width="1.2"/>
  <text x="90" y="248" font-size="12.5" font-weight="600" fill="#3b5468">Availability Zone A (us-east-1a)</text>

  <!-- AZ A public subnet -->
  <rect x="95" y="260" width="450" height="110" rx="6" fill="#e8f6ec" stroke="#4c9a5a" stroke-width="1.2"/>
  <text x="108" y="278" font-size="11.5" fill="#2c5c34">Public subnet</text>
  <rect x="115" y="290" width="200" height="60" rx="5" fill="#fff2d9" stroke="#c97a1a"/>
  <text x="215" y="315" font-size="11.5" text-anchor="middle" fill="#5a3a10">ALB</text>
  <text x="215" y="330" font-size="9.5" text-anchor="middle" fill="#7a5a20">(AWS Load Balancer</text>
  <text x="215" y="341" font-size="9.5" text-anchor="middle" fill="#7a5a20">Controller-managed)</text>
  <rect x="335" y="290" width="185" height="60" rx="5" fill="#fff2d9" stroke="#c97a1a"/>
  <text x="427" y="315" font-size="11.5" text-anchor="middle" fill="#5a3a10">NAT Gateway</text>
  <text x="427" y="330" font-size="9.5" text-anchor="middle" fill="#7a5a20">(single NAT —</text>
  <text x="427" y="341" font-size="9.5" text-anchor="middle" fill="#7a5a20">cost guardrail)</text>

  <!-- AZ A private subnet: EKS nodes -->
  <rect x="95" y="385" width="450" height="180" rx="6" fill="#e9edfb" stroke="#5064c9" stroke-width="1.2"/>
  <text x="108" y="403" font-size="11.5" fill="#2a3480">Private subnet — EKS node group</text>
  <rect x="112" y="415" width="120" height="45" rx="4" fill="#ffffff" stroke="#5064c9"/>
  <text x="172" y="440" font-size="10.5" text-anchor="middle" fill="#2a3480">ui</text>
  <rect x="242" y="415" width="120" height="45" rx="4" fill="#ffffff" stroke="#5064c9"/>
  <text x="302" y="440" font-size="10.5" text-anchor="middle" fill="#2a3480">catalog</text>
  <rect x="372" y="415" width="150" height="45" rx="4" fill="#ffffff" stroke="#5064c9"/>
  <text x="447" y="440" font-size="10.5" text-anchor="middle" fill="#2a3480">checkout</text>
  <rect x="112" y="470" width="120" height="45" rx="4" fill="#ffffff" stroke="#5064c9"/>
  <text x="172" y="495" font-size="10.5" text-anchor="middle" fill="#2a3480">carts</text>
  <rect x="242" y="470" width="120" height="45" rx="4" fill="#ffffff" stroke="#5064c9"/>
  <text x="302" y="495" font-size="10.5" text-anchor="middle" fill="#2a3480">orders</text>
  <rect x="372" y="470" width="150" height="45" rx="4" fill="#ffffff" stroke="#5064c9"/>
  <text x="447" y="490" font-size="10.5" text-anchor="middle" fill="#2a3480">redis / rabbitmq</text>
  <text x="447" y="502" font-size="9" text-anchor="middle" fill="#5a6b9b">(in-cluster brokers)</text>
  <rect x="112" y="525" width="410" height="30" rx="4" fill="#dfe4fb" stroke="#5064c9" stroke-dasharray="3,2"/>
  <text x="317" y="545" font-size="10" text-anchor="middle" fill="#2a3480">Controllers: ALB Controller · Cluster Autoscaler · External Secrets · CloudWatch Observability</text>

  <!-- AZ A private subnet: RDS -->
  <rect x="95" y="580" width="450" height="185" rx="6" fill="#fdeaea" stroke="#b8464c" stroke-width="1.2"/>
  <text x="108" y="598" font-size="11.5" fill="#7a1e22">Private subnet — data layer</text>
  <rect x="115" y="612" width="195" height="65" rx="5" fill="#ffffff" stroke="#b8464c"/>
  <text x="212" y="635" font-size="11" text-anchor="middle" fill="#7a1e22">RDS MySQL</text>
  <text x="212" y="649" font-size="9.5" text-anchor="middle" fill="#96393e">catalog (db.t4g.micro)</text>
  <text x="212" y="663" font-size="9.5" text-anchor="middle" fill="#96393e">single-AZ, backups on</text>
  <rect x="330" y="612" width="195" height="65" rx="5" fill="#ffffff" stroke="#b8464c"/>
  <text x="427" y="635" font-size="11" text-anchor="middle" fill="#7a1e22">RDS PostgreSQL</text>
  <text x="427" y="649" font-size="9.5" text-anchor="middle" fill="#96393e">orders (db.t4g.micro)</text>
  <text x="427" y="663" font-size="9.5" text-anchor="middle" fill="#96393e">single-AZ, backups on</text>
  <rect x="115" y="690" width="410" height="55" rx="5" fill="#ffffff" stroke="#b8464c"/>
  <text x="320" y="712" font-size="11" text-anchor="middle" fill="#7a1e22">Secrets Manager — catalog-db-secret / orders-db-secret</text>
  <text x="320" y="727" font-size="9.5" text-anchor="middle" fill="#96393e">injected via External Secrets Operator (IRSA)</text>

  <!-- AZ B -->
  <rect x="590" y="225" width="490" height="560" rx="6" fill="#ffffff" stroke="#9db3c8" stroke-width="1.2"/>
  <text x="605" y="248" font-size="12.5" font-weight="600" fill="#3b5468">Availability Zone B (us-east-1b)</text>

  <rect x="610" y="260" width="450" height="110" rx="6" fill="#e8f6ec" stroke="#4c9a5a" stroke-width="1.2"/>
  <text x="623" y="278" font-size="11.5" fill="#2c5c34">Public subnet</text>
  <rect x="630" y="290" width="200" height="60" rx="5" fill="#fff2d9" stroke="#c97a1a"/>
  <text x="730" y="315" font-size="11.5" text-anchor="middle" fill="#5a3a10">ALB (2nd AZ)</text>
  <text x="730" y="330" font-size="9.5" text-anchor="middle" fill="#7a5a20">ALB requires ≥2 AZs</text>

  <rect x="610" y="385" width="450" height="180" rx="6" fill="#e9edfb" stroke="#5064c9" stroke-width="1.2"/>
  <text x="623" y="403" font-size="11.5" fill="#2a3480">Private subnet — EKS node group</text>
  <rect x="627" y="415" width="410" height="130" rx="4" fill="#ffffff" stroke="#5064c9" stroke-dasharray="3,2"/>
  <text x="832" y="450" font-size="11" text-anchor="middle" fill="#2a3480">Additional EKS-managed nodes</text>
  <text x="832" y="468" font-size="10" text-anchor="middle" fill="#5a6b9b">(pods scheduled across AZs by</text>
  <text x="832" y="484" font-size="10" text-anchor="middle" fill="#5a6b9b">the Kubernetes scheduler;</text>
  <text x="832" y="500" font-size="10" text-anchor="middle" fill="#5a6b9b">Cluster Autoscaler adds nodes here too)</text>

  <rect x="610" y="580" width="450" height="185" rx="6" fill="#fdeaea" stroke="#b8464c" stroke-width="1.2"/>
  <text x="623" y="598" font-size="11.5" fill="#7a1e22">Private subnet — DB subnet group (2nd AZ)</text>
  <text x="835" y="670" font-size="10.5" text-anchor="middle" fill="#96393e">RDS subnet group spans both AZs</text>
  <text x="835" y="686" font-size="10.5" text-anchor="middle" fill="#96393e">(instances themselves are single-AZ</text>
  <text x="835" y="702" font-size="10.5" text-anchor="middle" fill="#96393e">deployments, per cost guardrail)</text>

  <!-- DynamoDB (spans AZs, drawn once) -->
  <rect x="700" y="720" width="270" height="60" rx="5" fill="#ffffff" stroke="#b8464c"/>
  <text x="835" y="745" font-size="11" text-anchor="middle" fill="#7a1e22">DynamoDB — retail-carts</text>
  <text x="835" y="760" font-size="9.5" text-anchor="middle" fill="#96393e">carts service (PAY_PER_REQUEST)</text>

  <!-- EKS control plane label -->
  <rect x="75" y="795" width="1000" height="12" fill="none"/>
  <text x="90" y="805" font-size="9" fill="#8a97a3"></text>

  <!-- Outside VPC: S3 + Lambda + CloudWatch + IAM -->
  <rect x="1135" y="120" width="410" height="230" rx="8" fill="#fff7e8" stroke="#c97a1a" stroke-width="1.5"/>
  <text x="1150" y="143" font-size="13.5" font-weight="700" fill="#7a5a20">Event-driven asset pipeline</text>
  <rect x="1155" y="160" width="170" height="55" rx="5" fill="#ffffff" stroke="#c97a1a"/>
  <text x="1240" y="182" font-size="11" text-anchor="middle" fill="#5a3a10">S3: bedrock-assets-*</text>
  <text x="1240" y="196" font-size="9.5" text-anchor="middle" fill="#7a5a20">private, BPA enabled</text>
  <rect x="1350" y="160" width="170" height="55" rx="5" fill="#ffffff" stroke="#c97a1a"/>
  <text x="1435" y="182" font-size="11" text-anchor="middle" fill="#5a3a10">Lambda</text>
  <text x="1435" y="196" font-size="9.5" text-anchor="middle" fill="#7a5a20">bedrock-asset-processor</text>
  <path d="M1325,187 L1350,187" stroke="#c97a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1337" y="180" font-size="8.5" text-anchor="middle" fill="#7a5a20">s3:ObjectCreated</text>
  <text x="1150" y="245" font-size="10.5" fill="#7a5a20">1. bedrock-dev-view (s3:PutObject) or marketing</text>
  <text x="1150" y="260" font-size="10.5" fill="#7a5a20">   team uploads an image to the bucket</text>
  <text x="1150" y="278" font-size="10.5" fill="#7a5a20">2. S3 event notification invokes Lambda</text>
  <text x="1150" y="296" font-size="10.5" fill="#7a5a20">3. Lambda logs "Image received: [filename]"</text>
  <text x="1150" y="314" font-size="10.5" fill="#7a5a20">   to CloudWatch Logs</text>
  <text x="1150" y="332" font-size="10.5" fill="#7a5a20">   (execution role: read that object + write logs only)</text>

  <rect x="1135" y="365" width="410" height="150" rx="8" fill="#eef4fb" stroke="#3b6ea5" stroke-width="1.5"/>
  <text x="1150" y="388" font-size="13.5" font-weight="700" fill="#204a76">Observability</text>
  <rect x="1155" y="400" width="370" height="45" rx="5" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="1340" y="418" font-size="10.5" text-anchor="middle" fill="#204a76">CloudWatch Log Groups — control plane</text>
  <text x="1340" y="431" font-size="9" text-anchor="middle" fill="#3b6ea5">api · audit · authenticator · controllerManager · scheduler</text>
  <rect x="1155" y="453" width="370" height="45" rx="5" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="1340" y="471" font-size="10.5" text-anchor="middle" fill="#204a76">Amazon CloudWatch Observability EKS add-on</text>
  <text x="1340" y="484" font-size="9" text-anchor="middle" fill="#3b6ea5">ships container/application logs (IRSA)</text>

  <rect x="1135" y="530" width="410" height="200" rx="8" fill="#f0ecf9" stroke="#6b4fa0" stroke-width="1.5"/>
  <text x="1150" y="553" font-size="13.5" font-weight="700" fill="#432a70">Developer access — bedrock-dev-view</text>
  <rect x="1155" y="565" width="370" height="50" rx="5" fill="#ffffff" stroke="#6b4fa0"/>
  <text x="1340" y="585" font-size="10.5" text-anchor="middle" fill="#432a70">IAM user + ReadOnlyAccess (console)</text>
  <text x="1340" y="600" font-size="9" text-anchor="middle" fill="#6b4fa0">+ scoped s3:PutObject on assets bucket</text>
  <rect x="1155" y="625" width="370" height="50" rx="5" fill="#ffffff" stroke="#6b4fa0"/>
  <text x="1340" y="645" font-size="10.5" text-anchor="middle" fill="#432a70">EKS Access Entry → AmazonEKSViewPolicy</text>
  <text x="1340" y="660" font-size="9" text-anchor="middle" fill="#6b4fa0">scoped to namespace: retail-app</text>
  <text x="1150" y="700" font-size="10" fill="#6b4fa0">get pods: ✓ allowed   ·   delete pod: ✗ denied</text>

  <rect x="1135" y="745" width="410" height="150" rx="8" fill="#eaf3ee" stroke="#3f8a5c" stroke-width="1.5"/>
  <text x="1150" y="768" font-size="13.5" font-weight="700" fill="#245134">CI/CD</text>
  <text x="1150" y="792" font-size="10.5" fill="#245134">GitHub Actions (OIDC, no long-lived keys)</text>
  <text x="1150" y="812" font-size="10.5" fill="#245134">PR → terraform plan → posted as PR comment</text>
  <text x="1150" y="832" font-size="10.5" fill="#245134">merge to main → terraform apply</text>
  <text x="1150" y="852" font-size="10.5" fill="#245134">state: S3 backend + native lockfile (TF ≥1.11)</text>
  <text x="1150" y="872" font-size="10.5" fill="#245134">scoped IAM role (not AdministratorAccess)</text>

  <!-- Internet -> IGW -> ALB -->
  <path d="M555,163 L555,140" stroke="#5a6b7b" stroke-width="1.5"/>
  <text x="600" y="120" font-size="10.5" fill="#5a6b7b">Internet users</text>
  <path d="M480,180 L325,180 L325,290" stroke="#5a6b7b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ALB -> ui pods -->
  <path d="M215,350 L215,415" stroke="#5a6b7b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- EKS nodes -> RDS -->
  <path d="M172,515 L172,612" stroke="#b8464c" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <path d="M302,515 L302,612" stroke="#b8464c" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

  <!-- carts -> DynamoDB -->
  <path d="M172,515 C172,680 700,760 700,750" stroke="#b8464c" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Secrets manager -> app pods -->
  <path d="M320,690 L320,555" stroke="#8a97a3" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>

  <!-- dev-view -> EKS + S3 -->
  <path d="M1155,650 C900,650 700,500 545,470" stroke="#6b4fa0" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1155,590 C1000,500 1050,300 1135,190" stroke="#6b4fa0" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>

  <!-- EKS -> CloudWatch -->
  <path d="M1075,470 L1155,470" stroke="#3b6ea5" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="50" y="1000" width="1520" height="120" rx="8" fill="#ffffff" stroke="#d5dbe1"/>
  <text x="65" y="1025" font-size="12.5" font-weight="700" fill="#1b2733">Legend</text>
  <rect x="65" y="1035" width="18" height="14" fill="#e8f6ec" stroke="#4c9a5a"/><text x="90" y="1046" font-size="10.5" fill="#3b5468">Public subnet</text>
  <rect x="205" y="1035" width="18" height="14" fill="#e9edfb" stroke="#5064c9"/><text x="230" y="1046" font-size="10.5" fill="#3b5468">Private subnet — compute (EKS)</text>
  <rect x="450" y="1035" width="18" height="14" fill="#fdeaea" stroke="#b8464c"/><text x="475" y="1046" font-size="10.5" fill="#3b5468">Private subnet — data layer</text>
  <rect x="680" y="1035" width="18" height="14" fill="#fff2d9" stroke="#c97a1a"/><text x="705" y="1046" font-size="10.5" fill="#3b5468">Networking (ALB / NAT / IGW)</text>
  <text x="65" y="1075" font-size="10.5" fill="#3b5468">Solid arrows = network/data traffic. Dashed arrows = IAM/config relationships (Secrets Manager injection, IAM access, log shipping).</text>
  <text x="65" y="1095" font-size="10.5" fill="#3b5468">All resources tagged Project: tinyuka-2025-capstone. Full detail: see README.md and terraform/ modules.</text>
